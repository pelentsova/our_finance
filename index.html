<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Наши финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0E1013;--s1:#171A1F;--s2:#1E2228;--s3:#262B33;--line:#23272E;--line2:#2A2F37;
  --t1:#F2F4F7;--t2:#C9CFD8;--t3:#9AA3AF;
  --acc:#7CCBF5;--acc2:#B8E4FB;--inc:#5BE3A6;--exp:#FF8A65;--lav:#A99BFF;--amb:#F5C26B;--pink:#F59BC6;
  --safe-b:max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px));
  --safe-t:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t1);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.num{font-family:Unbounded,sans-serif;font-variant-numeric:tabular-nums}
.muted{color:var(--t3)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.screen{display:none;flex-direction:column;gap:18px;padding:calc(18px + var(--safe-t)) 20px calc(120px + var(--safe-b))}
.screen.on{display:flex}
.screen.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.screen.enter>*:nth-child(2){animation-delay:.05s}.screen.enter>*:nth-child(3){animation-delay:.1s}.screen.enter>*:nth-child(4){animation-delay:.15s}
.screen.enter>*:nth-child(5){animation-delay:.2s}.screen.enter>*:nth-child(6){animation-delay:.25s}.screen.enter>*:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%,100%{transform:translateX(-5px);opacity:.5}50%{transform:translateX(5px);opacity:1}}

.h1{font-family:Unbounded,sans-serif;font-weight:700;font-size:22px;margin:0}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card-t{font-size:15px;font-weight:700}
.link{background:none;border:0;padding:6px 0;color:var(--acc);font-size:13px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line2);background:transparent;color:var(--t2);font-size:13px;font-weight:600;transition:all .2s}
.chip.on{background:var(--t1);color:var(--bg);border-color:var(--t1)}
.chip.sm{height:32px;padding:0 10px;font-size:12px;font-weight:700;min-width:38px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--s1);border-radius:16px}
.seg button{height:40px;border:0;border-radius:12px;background:transparent;color:var(--t2);font-size:14px;font-weight:700;transition:all .2s}
.seg button.on{background:var(--t1);color:var(--bg)}
.seg.soft button.on{background:var(--s3);color:var(--t1)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--s1);display:flex;align-items:center;justify-content:center;flex:none}
.bar{height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.bar>i{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:4px;transition:width .9s cubic-bezier(.2,.8,.2,1),left .9s cubic-bezier(.2,.8,.2,1)}
.list{background:var(--s1);border-radius:20px;padding:2px 14px;display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0}
.item+.item{border-top:1px solid var(--line)}
.ico{width:42px;height:42px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:Unbounded,sans-serif;font-weight:700;font-size:14px}
.ttl{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden}
.tag{flex:none;padding:2px 7px;border-radius:7px;font-size:10px;font-weight:700}
.amt{font-family:Unbounded,sans-serif;font-weight:600;font-size:13px;white-space:nowrap}
.r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}

/* nav */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));width:calc(100% - 32px);max-width:488px;height:68px;background:rgba(23,26,31,.92);border:1px solid var(--line2);border-radius:34px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:20}
nav.tabs button{height:56px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--t3);font-size:10px;font-weight:600}
nav.tabs button.on{color:var(--acc);font-weight:700}
nav.tabs .fab{width:56px;height:56px;margin:-30px auto 0;border-radius:28px;background:var(--acc);color:var(--bg);box-shadow:0 10px 30px rgba(124,203,245,.3);animation:pop .5s .3s both}

/* sheets */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;transform:translateY(100%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s;display:flex;flex-direction:column}
.sheet.open{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.sheet-h{padding:calc(16px + var(--safe-t)) 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:520px;width:100%;margin:0 auto}
.sheet-b{flex:1;overflow-y:auto;padding:4px 20px calc(110px + var(--safe-b));display:flex;flex-direction:column;gap:20px;max-width:520px;width:100%;margin:0 auto}
.sheet-f{position:absolute;left:0;right:0;bottom:0;padding:14px 20px calc(18px + var(--safe-b));background:linear-gradient(to top,var(--bg) 70%,rgba(14,16,19,0))}
.sheet-f .btn{max-width:480px;margin:0 auto;display:block}
.btn{width:100%;height:56px;border-radius:20px;border:0;background:var(--acc);color:var(--bg);font-size:16px;font-weight:700}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--s1);color:var(--t1);border:1px solid var(--line2);height:48px;font-size:14px}
.lbl{font-size:13px;color:var(--t3)}
.field{height:52px;padding:0 16px;border-radius:16px;background:var(--s1);border:1px solid var(--line2);color:var(--t1);font-size:14px;outline:none;width:100%}
.field:focus{border-color:var(--acc)}
.wchip{height:40px;padding:0 14px 0 6px;border-radius:20px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:var(--s1);color:var(--t2);border:1px solid var(--line2);transition:all .2s}
.wchip.on{background:var(--s3);color:var(--t1);border-color:var(--acc)}
.cb{height:28px;min-width:28px;padding:0 6px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.cat{height:38px;padding:0 14px;border-radius:19px;font-size:13px;font-weight:600;background:var(--s1);color:var(--t2);border:1px solid var(--line2);transition:all .2s}
.sw{width:52px;height:32px;flex:none;border-radius:16px;border:0;padding:0;position:relative;background:#2F343C;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:var(--t1);transition:left .2s}
.sw[aria-checked="true"]{background:var(--acc)}
.sw[aria-checked="true"]::after{left:24px}
.step{width:36px;height:36px;border-radius:12px;border:0;background:var(--s3);font-size:18px}
.amount-in{background:transparent;border:0;outline:none;text-align:center;font-family:Unbounded,sans-serif;font-weight:700;font-size:44px;letter-spacing:-1px;min-width:0}
.verdict{padding:10px 14px;border-radius:14px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--t1);color:var(--bg);border-radius:16px;padding:12px 16px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;transition:all .3s;z-index:60;width:max-content;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:#0B6FA4;font-weight:700;font-size:14px;padding:4px}
.loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);z-index:80;transition:opacity .4s}
.loader i{width:40px;height:40px;border-radius:20px;border:3px solid var(--s3);border-top-color:var(--acc);animation:spin .9s linear infinite}
.banner{padding:10px 14px;border-radius:14px;background:rgba(245,194,107,.12);color:var(--amb);font-size:12px;font-weight:600;line-height:1.4}
.err{padding:12px 14px;border-radius:14px;background:rgba(255,138,101,.12);color:#FFB199;font-size:13px;line-height:1.45}
.flow{animation:slide 2.4s ease-in-out infinite}
.rate-row{display:flex;align-items:center;gap:10px;padding:11px 0}
.rate-row+.rate-row{border-top:1px solid var(--line)}
.pill{padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div id="app">

  <!-- ГЛАВНАЯ -->
  <section class="screen on" id="s-home" aria-label="Главная"></section>
  <!-- ОПЕРАЦИИ -->
  <section class="screen" id="s-ops" aria-label="Операции"></section>
  <!-- БЮДЖЕТ -->
  <section class="screen" id="s-budget" aria-label="Бюджет"></section>
  <!-- ИЗ РФ -->
  <section class="screen" id="s-rf" aria-label="Переводы из РФ"></section>

  <nav class="tabs" aria-label="Навигация">
    <button data-go="home" class="on"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Главная</button>
    <button data-go="ops"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Операции</button>
    <div><button class="fab" data-act="openAdd" aria-label="Добавить операцию"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <button data-go="budget"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Бюджет</button>
    <button data-go="rf"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>Из РФ</button>
  </nav>
</div>

<!-- НОВАЯ ОПЕРАЦИЯ -->
<div class="sheet" id="sh-add" role="dialog" aria-modal="true" aria-label="Новая операция">
  <div class="sheet-h">
    <button class="iconbtn" data-act="closeAdd" aria-label="Закрыть"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <span style="font-size:16px;font-weight:700">Новая операция</span>
    <label class="row" style="height:36px;padding:0 10px;border-radius:18px;border:1px solid var(--line2);background:var(--s1);font-size:12px;font-weight:600;color:var(--t2);gap:6px">
      <span class="sr">Дата</span>
      <input type="date" id="a-date" style="background:none;border:0;color:var(--t2);font-size:12px;font-weight:600;outline:none;width:112px;color-scheme:dark">
    </label>
  </div>
  <div class="sheet-b" id="add-body"></div>
  <div class="sheet-f"><button class="btn" id="a-save" data-act="save">Сохранить в таблицу</button></div>
</div>

<!-- КАТЕГОРИЯ -->
<div class="sheet" id="sh-cat" role="dialog" aria-modal="true" aria-label="Категория">
  <div class="sheet-h">
    <button class="iconbtn" data-act="closeCat" aria-label="Закрыть"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <span style="font-size:16px;font-weight:700" id="cat-title">Категория</span>
    <div style="width:44px"></div>
  </div>
  <div class="sheet-b" id="cat-body"></div>
</div>

<!-- КОНВЕРТЕР -->
<div class="sheet" id="sh-conv" role="dialog" aria-modal="true" aria-label="Конвертер валют">
  <div class="sheet-h">
    <button class="iconbtn" data-act="closeConv" aria-label="Закрыть"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <span style="font-size:16px;font-weight:700">Конвертер</span>
    <div style="width:44px"></div>
  </div>
  <div class="sheet-b" id="conv-body"></div>
</div>

<div class="toast" id="toast" role="status"><span id="toast-t"></span><button id="toast-b" class="hidden"></button></div>
<div class="loader" id="loader"><i></i><span class="muted" style="font-size:13px">Загружаю таблицу…</span></div>

<script>
/* ================= НАСТРОЙКА ================= */
const CONFIG = {
  // Адрес веб-приложения Apps Script. Можно оставить пустым — бот сам передаёт его в ссылке (?api=…)
  API_URL: ''
};
try {
  const qApi = new URLSearchParams(location.search).get('api');
  if (!CONFIG.API_URL && qApi && /^https:\/\/script\.google\.com\//.test(qApi)) CONFIG.API_URL = qApi;
} catch (e) {}

/* ================= БАЗА ================= */
const tg = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(tg && tg.initData);
const DEMO = !CONFIG.API_URL || !IN_TG;
const $ = (s, r) => (r || document).querySelector(s);
const SYM = { EUR: '€', RSD: 'дин', RUB: '₽', USD: '$', AMD: '֏', TRY: '₺', GBP: '£', CHF: '₣', KZT: '₸', GEL: '₾', CNY: '¥' };
const CUR_COL = { EUR: '#7CCBF5', RSD: '#F5C26B', RUB: '#A99BFF' };
const GROUP_COL = ['#7CCBF5', '#5BE3A6', '#A99BFF', '#F59BC6', '#F5C26B', '#9AA3AF', '#FF8A65'];
const MONTHS_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = {};
function fmt(n, d) {
  d = d == null ? 2 : d;
  if (n == null || !isFinite(n)) return '—';
  const k = 'k' + d;
  nf[k] = nf[k] || new Intl.NumberFormat('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d });
  return nf[k].format(Math.abs(n)).replace(/ /g, ' ');
}
function money(n, cur, d) {
  if (d == null) d = cur === 'EUR' || cur === 'USD' ? 2 : (Math.abs(n) % 1 ? 2 : 0);
  return fmt(n, d) + ' ' + (SYM[cur] || cur);
}
function todayISO() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function dayLabel(iso) {
  const t = todayISO(), y = new Date(Date.now() - 864e5); y.setMinutes(y.getMinutes() - y.getTimezoneOffset());
  const [Y, M, D] = iso.split('-').map(Number);
  if (iso === t) return 'Сегодня, ' + D + ' ' + MONTHS_G[M - 1];
  if (iso === y.toISOString().slice(0, 10)) return 'Вчера, ' + D + ' ' + MONTHS_G[M - 1];
  return D + ' ' + MONTHS_G[M - 1] + (String(Y) !== t.slice(0, 4) ? ' ' + Y : '');
}
function haptic(type) { try { tg && tg.HapticFeedback && (type === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : type === 'err' ? tg.HapticFeedback.notificationOccurred('error') : tg.HapticFeedback.selectionChanged()); } catch (e) {} }

/* ================= СОСТОЯНИЕ ================= */
const S = {
  data: null, rates: null, me: null, screen: 'home',
  home: { cur: 'EUR', wcur: 'all' },
  ops: { type: 'all', who: 'all', q: '', limit: 60 },
  budget: { m: null, open: null, period: 'this', month: null, from: '', to: '', who: 'all', wallet: 'all', move: false },
  cat: { name: null, q: '' },
  rf: { who: 'all', rub: 100000 },
  conv: { amount: '100', cur: 'EUR' },
  add: null, lastRow: null, busy: false
};

/* ================= API ================= */
async function api(action, extra) {
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, initData: tg.initData }, extra || {}))
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Ошибка сервера');
  return j;
}

async function ratesDirect() {
  const out = { rates: { EUR: 1 }, chg: { EUR: 0 }, sources: [] };
  await Promise.all([
    fetch('https://open.er-api.com/v6/latest/EUR').then(r => r.json()).then(r => {
      if (r.result === 'success') { Object.assign(out.rates, r.rates); out.sources.push('open.er-api.com'); out.date = r.time_last_update_utc; }
    }).catch(() => {}),
    fetch('https://www.cbr-xml-daily.ru/daily_json.js').then(r => r.json()).then(c => { out._cbr = c; }).catch(() => {})
  ]);
  if (out._cbr) applyCbr(out, out._cbr);
  delete out._cbr;
  return out;
}
function applyCbr(out, c) {
  const V = c.Valute; if (!V || !V.EUR) return;
  const e = V.EUR.Value / V.EUR.Nominal, ep = V.EUR.Previous / V.EUR.Nominal;
  out.rates.RUB = e; out.chg.RUB = e / ep - 1;
  out.cbr = { EUR: e, USD: V.USD ? V.USD.Value / V.USD.Nominal : null, date: c.Date };
  Object.keys(V).forEach(k => {
    if (k === 'EUR') return;
    const p = V[k].Value / V[k].Nominal, pp = V[k].Previous / V[k].Nominal;
    out.chg[k] = (e / p) / (ep / pp) - 1;
    if (!out.rates[k]) out.rates[k] = e / p;
  });
  out.sources.push('ЦБ РФ');
}
const R = () => (S.rates && S.rates.rates) || {};
function conv(n, from, to) {
  const r = R();
  if (from === to) return n;
  if (!r[from] || !r[to]) return null;
  return n / r[from] * r[to];
}
function pairChg(base, quote) {
  const c = (S.rates && S.rates.chg) || {};
  if (c[base] == null || c[quote] == null) return null;
  return (1 + c[quote]) / (1 + c[base]) - 1;
}

/* ================= ЗАГРУЗКА ================= */
async function boot() {
  if (tg) {
    try {
      tg.ready(); tg.expand();
      tg.setHeaderColor && tg.setHeaderColor('#0E1013');
      tg.setBackgroundColor && tg.setBackgroundColor('#0E1013');
      tg.setBottomBarColor && tg.setBottomBarColor('#0E1013');
      tg.disableVerticalSwipes && tg.disableVerticalSwipes();
      tg.BackButton.onClick(closeTop);
    } catch (e) {}
  }
  try {
    if (DEMO) {
      S.data = demoData();
      S.me = { name: 'Егор' };
      S.rates = await ratesDirect();
      if (!S.rates.rates.RSD) S.rates = demoRates();
    } else {
      const j = await api('all');
      S.data = j; S.me = j.me; S.rates = j.rates;
      if (!S.rates || !S.rates.rates || !S.rates.rates.RUB) { const d = await ratesDirect(); if (d.rates.RUB) S.rates = d; }
    }
  } catch (e) {
    $('#loader').innerHTML = '<div style="max-width:340px;padding:24px;display:flex;flex-direction:column;gap:14px">' +
      '<span class="h1" style="font-size:18px">Не удалось открыть таблицу</span><div class="err">' + esc(e.message) + '</div>' +
      '<button class="btn ghost" onclick="location.reload()">Попробовать ещё раз</button></div>';
    return;
  }
  const bm = S.data.budget && S.data.budget.months;
  S.budget.m = bm && bm.length ? bm.length - 1 : 0;
  renderAll();
  enter($('#s-home'));
  const l = $('#loader'); l.style.opacity = 0; setTimeout(() => l.remove(), 400);
}

function enter(el) { el.classList.add('enter'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('enter'), 900); }
function renderAll() { renderHome(); renderOps(); renderBudget(); renderRF(); }

function go(name) {
  if (S.screen === name) return;
  S.screen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + name));
  enter($('#s-' + name));
  document.querySelectorAll('nav.tabs [data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === name));
  const map = { home: renderHome, ops: renderOps, budget: renderBudget, rf: renderRF };
  map[name]();
  window.scrollTo(0, 0);
  haptic();
}

/* ================= АНИМАЦИИ ================= */
function animate(root) {
  root.querySelectorAll('[data-to]').forEach(el => {
    const to = parseFloat(el.dataset.to), d = +el.dataset.d || 0, suf = el.dataset.suf || '', pre = el.dataset.pre || '';
    const t0 = performance.now(), dur = 900;
    (function step(t) {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = pre + fmt(to * e, d) + suf;
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.querySelectorAll('[data-w]').forEach(el => { el.style.width = el.dataset.w + '%'; if (el.dataset.l) el.style.left = el.dataset.l + '%'; });
    root.querySelectorAll('[data-dash]').forEach(el => { el.style.strokeDasharray = el.dataset.dash; if (el.dataset.off) el.style.strokeDashoffset = el.dataset.off; });
  }));
}

function cleanTitle(op) {
  let c = (op.comment || '').replace(/\((?:есть|нет|неь)[^)]*\)/gi, '').replace(/\s{2,}/g, ' ').trim();
  if (op.type === 'Перевод') return c || ('Перевод → ' + op.to);
  return c || op.cat || op.type;
}
function hasReceipt(op) { return /есть\s*(?:\d+\s*)?чек/i.test(op.comment || ''); }
function groupColorOf(cat) {
  const B = S.data.budget || {};
  for (let i = 0; i < (B.groups || []).length; i++) if (B.groups[i].cats.some(c => c.name === cat)) return GROUP_COL[i % GROUP_COL.length];
  return '#9AA3AF';
}
function opEur(op) {
  if (op.eur != null) return op.eur;
  if (op.amount == null) return null;
  return conv(op.amount, op.cur, 'EUR');
}
const WHO_TAG = { 'Егор': ['rgba(124,203,245,.16)', '#9BD8F7'], 'Лена': ['rgba(169,155,255,.18)', '#C2B8FF'], 'Общее': ['#262B33', '#C9CFD8'] };
function opRow(op) {
  const inc = op.type === 'Доход', mv = op.type === 'Перевод';
  const col = inc ? '#5BE3A6' : mv ? '#7CCBF5' : groupColorOf(op.cat);

  const e = opEur(op);
  const amount = op.amount == null ? '—' : (inc ? '+ ' : mv ? '' : '− ') + money(op.amount, op.cur);
  const sub = mv && op.received ? '→ ' + money(op.received, curOfWallet(op.to)) : (op.cur !== 'EUR' && e != null ? '≈ ' + fmt(e) + ' €' : '');
  const meta = mv ? esc(op.wallet) + ' → ' + esc(op.to) : esc(op.cat) + ' · ' + esc(op.wallet);
  return `<div class="item"><div class="ico" style="background:${col}22;color:${col}">${mv ? '⇄' : esc((op.cat || op.type).charAt(0))}</div>
    <div class="grow"><span class="ttl">${esc(cleanTitle(op))}</span>
      <span class="meta"><span class="tag" style="background:${wt[0]};color:${wt[1]}">${esc(op.who || 'Общее')}</span>${meta}
      ${hasReceipt(op) ? '<svg role="img" aria-label="Есть чек" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5BE3A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>' : ''}
      ${op.move ? '<span class="tag" style="background:rgba(245,194,107,.14);color:#F5C26B">переезд</span>' : ''}</span></div>
    <div class="r"><span class="amt" style="color:${inc ? 'var(--inc)' : mv ? 'var(--acc)' : 'var(--t1)'}">${amount}</span><span style="font-size:11px" class="muted">${sub}</span></div></div>`;
}

/* ================= БЮДЖЕТ ================= */
const MONTHS_N = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_S = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const fromIso = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (s, n) => { const d = fromIso(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((fromIso(b) - fromIso(a)) / 864e5) + 1;
const monthKey = s => s.slice(0, 7);
const monthStart = k => k + '-01';
const monthEnd = k => { const p = k.split('-').map(Number); return iso(new Date(p[0], p[1], 0)); };
const shiftMonth = (k, n) => { const p = k.split('-').map(Number); const d = new Date(p[0], p[1] - 1 + n, 1); return iso(d).slice(0, 7); };
const daysInMonth = k => +monthEnd(k).slice(8);
const overlap = (a1, b1, a2, b2) => { const a = a1 > a2 ? a1 : a2, b = b1 < b2 ? b1 : b2; return a > b ? 0 : daysBetween(a, b); };
const monthLabel = k => MONTHS_N[+k.slice(5) - 1] + ' ' + k.slice(0, 4);

function opMonths() {
  const set = {};
  (S.data.ops || []).forEach(o => { if (o.type === 'Расход' && o.date) set[monthKey(o.date)] = 1; });
  set[monthKey(todayISO())] = 1;
  return Object.keys(set).sort().reverse();
}

/** Выбранный период → { from, to, kind, label, prev:{from,to} } */
function budgetRange() {
  const B = S.budget, t = todayISO(), cm = monthKey(t);
  let from, to, kind = 'month', label;
  if (B.period === 'this') { from = monthStart(cm); to = monthEnd(cm); label = monthLabel(cm); }
  else if (B.period === 'prev') { const k = shiftMonth(cm, -1); from = monthStart(k); to = monthEnd(k); label = monthLabel(k); }
  else if (B.period === 'month') { const k = B.month || cm; from = monthStart(k); to = monthEnd(k); label = monthLabel(k); }
  else if (B.period === 'all') {
    const ds = (S.data.ops || []).filter(o => o.type === 'Расход').map(o => o.date).sort();
    from = ds[0] || monthStart(cm); to = t; kind = 'range'; label = 'Всё время';
  } else {
    from = B.from || monthStart(cm); to = B.to || t; if (from > to) { const x = from; from = to; to = x; }
    kind = 'range'; label = dayLabel(from).replace(/^(Сегодня|Вчера), /, '') + ' — ' + dayLabel(to).replace(/^(Сегодня|Вчера), /, '');
  }
  let prev;
  if (kind === 'month') { const k = shiftMonth(monthKey(from), -1); prev = { from: monthStart(k), to: monthEnd(k), label: MONTHS_N[+k.slice(5) - 1].toLowerCase() }; }
  else { const n = daysBetween(from, to); prev = { from: addDays(from, -n), to: addDays(from, -1), label: 'предыдущие ' + n + ' дн.' }; }
  return { from, to, kind, label, prev };
}

function catInfo() {
  const exp = (S.data.dict && S.data.dict.expense) || [], m = {};
  exp.forEach(c => { m[c.name] = { plan: c.plan || 0, group: c.group || 'Прочее' }; });
  return { list: exp, map: m };
}

function opPassesFilters(op) {
  const B = S.budget;
  if (op.type !== 'Расход') return false;
  if (!B.move && op.move) return false;
  if (B.who !== 'all' && op.who !== B.who) return false;
  if (B.wallet !== 'all' && op.wallet !== B.wallet) return false;
  return true;
}

/** Сколько евро этой траты попадает в период [from, to]. Растянутые на n мес. — по частям, пропорционально дням. */
function opShare(op, from, to) {
  const e = opEur(op); if (!e) return 0;
  const n = op.spread > 1 ? op.spread : 1;
  if (n === 1) return op.date >= from && op.date <= to ? e : 0;
  let sum = 0, k = monthKey(op.date);
  for (let i = 0; i < n; i++, k = shiftMonth(k, 1)) {
    const ov = overlap(monthStart(k), monthEnd(k), from, to);
    if (ov) sum += e / n * ov / daysInMonth(k);
  }
  return sum;
}

/** План категории на период: план в месяц × доля дней каждого месяца */
function planFor(monthly, from, to) {
  if (!monthly) return 0;
  let sum = 0, k = monthKey(from);
  while (k <= monthKey(to)) { sum += monthly * overlap(monthStart(k), monthEnd(k), from, to) / daysInMonth(k); k = shiftMonth(k, 1); }
  return sum;
}

function budgetCalc(from, to) {
  const C = catInfo(), cats = {};
  C.list.forEach(c => { cats[c.name] = { name: c.name, group: c.group, plan: planFor(c.plan || 0, from, to), fact: 0, ops: [] }; });
  (S.data.ops || []).forEach(op => {
    if (!opPassesFilters(op)) return;
    const v = opShare(op, from, to); if (!v) return;
    if (!cats[op.cat]) cats[op.cat] = { name: op.cat || 'Без категории', group: 'Прочее', plan: 0, fact: 0, ops: [] };
    cats[op.cat].fact += v; cats[op.cat].ops.push(op);

  const groups = [], gi = {};
  Object.keys(cats).forEach(n => {
    const c = cats[n], g = c.group;
    if (!gi[g]) { gi[g] = { name: g, plan: 0, fact: 0, cats: [] }; groups.push(gi[g]); }
    gi[g].cats.push(c); gi[g].plan += c.plan; gi[g].fact += c.fact;
  });
  const inB = groups.filter(g => g.name !== 'Вне бюджета'), out = gi['Вне бюджета'] || { fact: 0, cats: [] };
  return { groups: inB, outside: out, cats, plan: inB.reduce((a, g) => a + g.plan, 0), fact: inB.reduce((a, g) => a + g.fact, 0) };
}

}
function plural(n, a, b, c) { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; }

      <div class="between" style="font-size:11px" ><span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.from)} → ${esc(r.to)}</span>

    ${whoList.length ? `<div class="chips" role="group" aria-label="Чьи переводы">${[['all', 'Все']].concat(whoList.map(w => [w, w])).map(x => `<button class="chip ${S.rf.who === x[0] ? 'on' : ''}" data-act="rfWho" data-v="${esc(x[0])}">${esc(x[1])}</button>`).join('')}</div>` : ''}

        <div style="flex:1;display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span style="font-size:12px" class="muted">Получено</span><span class="num" style="font-weight:700;font-size:19px;color:var(--acc)">${cnt(got, 2, ' €')}</span></div></div>

/** Блок «Если перевести сейчас» по курсу Арцахбанка: зелёный / жёлтый / красный */
function artsakhCard(A, est, cardAvg) {
  const Z = {
    green: ['rgba(91,227,166,.12)', 'var(--inc)', '🟢 Выгодно — хорошее время пополнить карту'],
    yellow: ['rgba(245,194,107,.13)', 'var(--amb)', '🟡 Средне — пополнить можно, но выгода небольшая'],
    red: ['rgba(255,138,101,.13)', '#FFB199', '🔴 Невыгодно — если можно подождать, транш лучше отложить'],
  }[A.zone];
  const vsAvg = cardAvg ? (A.withFee / cardAvg - 1) * 100 : null;
  const pos = Math.max(0, Math.min(100, (A.rate - (A.good - 6)) / ((A.bad + 6) - (A.good - 6)) * 100));
  const g = (A.good - (A.good - 6)) / ((A.bad + 6) - (A.good - 6)) * 100, b = (A.bad - (A.good - 6)) / ((A.bad + 6) - (A.good - 6)) * 100;
  return `<div class="card" style="gap:14px">
      <div class="between"><span class="card-t">Если перевести сейчас</span><button class="link" data-act="rateRefresh">Обновить курс</button></div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span class="muted" style="font-size:12px">Курс Арцахбанка: рубли → евро</span>
        <div class="row" style="align-items:baseline;gap:8px"><span class="num" style="font-weight:700;font-size:28px;color:${Z[1]}">${fmt(A.rate, 2)} ₽</span><span class="muted" style="font-size:13px">за 1 €</span></div>
        <span class="muted" style="font-size:12px">€ ${fmt(A.eurSell, 0)} драм ÷ ₽ ${fmt(A.rubBuy, 2)} драм${A.updated ? ' · обновлено ' + esc(A.updated) : ''}</span>
      </div>
      <div role="img" aria-label="Шкала: до ${A.good} выгодно, ${A.good}–${A.bad} средне, от ${A.bad} невыгодно" style="position:relative;height:10px;border-radius:5px;background:linear-gradient(to right,var(--inc) 0 ${g}%,var(--amb) ${g}% ${b}%,var(--exp) ${b}% 100%)">
        <span style="position:absolute;top:-5px;left:calc(${pos}% - 10px);width:20px;height:20px;border-radius:10px;background:var(--t1);border:4px solid var(--bg)"></span></div>
      <div class="between" style="font-size:11px;margin-top:-6px" aria-hidden="true"><span class="muted">выгодно &lt; ${A.good}</span><span class="muted">${A.good}–${A.bad}</span><span class="muted">${A.bad} &gt; невыгодно</span></div>
      <div class="verdict" style="background:${Z[0]};color:${Z[1]}">${Z[2]}</div>
      <label class="row" style="height:56px;padding:0 16px;border-radius:16px;background:var(--bg);border:1px solid var(--line2)">
        <span class="muted" style="font-size:14px">Отправляю</span>
        <input id="rf-rub" inputmode="decimal" value="${esc(S.rf.rub)}" style="flex:1;min-width:0;background:none;border:0;outline:none;text-align:right;font-family:Unbounded;font-size:18px;color:var(--t1)">
        <span style="font-weight:700" class="muted">₽</span></label>
      <div class="between"><span class="muted" style="font-size:13px">По курсу банка</span><span class="num" style="font-weight:600" id="rf-nofee">${fmt(S.rf.rub / A.rate)} €</span></div>
      <div class="between"><span style="font-size:13px;font-weight:700">С комиссией Т-Банка ${fmt(A.fee * 100, 1)}%</span><span class="num" style="font-weight:700;color:var(--acc);font-size:16px" id="rf-est">≈ ${fmt(est)} €</span></div>
      ${vsAvg != null ? `<span class="muted" style="font-size:12px">Ваш средний курс по прошлым пополнениям карты — ${fmt(cardAvg, 2)} ₽. Сейчас ${vsAvg < 0 ? 'на ' + fmt(-vsAvg, 1) + '% выгоднее' : 'на ' + fmt(vsAvg, 1) + '% дороже'}.</span>` : ''}
    </div>`;
}

        <button class="sw" role="switch" aria-checked="${A.check}" aria-label="Есть чек" data-act="addCheck"></button></div>
      <div class="row" style="padding:14px 0;border-top:1px solid var(--line)"><div class="grow"><span style="font-size:14px;font-weight:600">Переезд</span><span style="font-size:12px" class="muted">Не считать в обычном бюджете</span></div>
        <button class="sw" role="switch" aria-checked="${A.move}" aria-label="Переезд" data-act="addMove"></button></div>
      ${A.type === 'Расход' ? `<div class="row" style="padding:14px 0;border-top:1px solid var(--line)"><div class="grow"><span style="font-size:14px;font-weight:600">Растянуть на, мес.</span><span style="font-size:12px" class="muted">Годовую оплату разложить по месяцам</span></div>
        <div class="row" style="gap:4px"><button class="step" data-act="spread" data-v="-1" aria-label="Меньше">−</button><span class="num" style="width:32px;text-align:center;font-size:15px">${A.spread}</span><button class="step" data-act="spread" data-v="1" aria-label="Больше">+</button></div></div>` : ''}
    </div>
    <label style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Комментарий</span>
      <input id="a-comment" class="field" placeholder="Например: Пекарня" value="${esc(A.comment)}"></label>
    <div id="a-err"></div>`;
  $('#a-amount').addEventListener('input', e => { A.amount = e.target.value; e.target.style.width = fitW(A.amount); addCalc(); });
  $('#a-comment').addEventListener('input', e => { A.comment = e.target.value; });
  const rv = $('#a-recv'); if (rv) rv.addEventListener('input', e => { A.received = e.target.value; addCalc(); });
  addCalc();
}

function addCalc() {
  const A = S.add, cur = curOfWallet(A.wallet), a = parseNum(A.amount);
  const others = ['EUR', 'RSD', 'RUB'].filter(c => c !== cur);
  $('#a-calc').textContent = a ? '≈ ' + others.map(c => { const v = conv(a, cur, c); return v == null ? '' : money(v, c, c === 'EUR' ? 2 : 0); }).filter(Boolean).join(' · ') : '';
  const box = $('#a-rate');
  if (!box) return;
  const tcur = curOfWallet(A.to), r = parseNum(A.received);
  const fair = conv(a, cur, tcur);
  if (!a || !A.to) { box.innerHTML = ''; return; }
  if (cur === tcur) { box.innerHTML = '<span class="muted" style="font-size:12px">Перевод в той же валюте — курс не нужен</span>'; return; }
  const strong = (R()[cur] || 0) < (R()[tcur] || 0); // cur «дороже» → курс показываем как tcur за 1 cur
  const official = strong ? R()[tcur] / R()[cur] : R()[cur] / R()[tcur];
  const unit = strong ? `${SYM[tcur]} за 1 ${SYM[cur]}` : `${SYM[cur]} за 1 ${SYM[tcur]}`;
  let html = `<div class="between" style="font-size:13px"><span class="muted">Курс сегодня${cur === 'RUB' || tcur === 'RUB' ? ' (ЦБ)' : ''}</span><span style="font-weight:700">${fmt(official, official < 1 ? 4 : 2)} ${unit}</span></div>
    <div class="between" style="font-size:13px"><span class="muted">По этому курсу пришло бы</span><span style="font-weight:700">${fair == null ? '—' : money(fair, tcur)}</span></div>`;
  if (r && fair) {
    const actual = strong ? r / a : a / r;
    const lossPct = 1 - r / fair, lossEur = conv(fair - r, tcur, 'EUR');
    const v = lossPct < 0.015 ? ['rgba(91,227,166,.12)', 'var(--inc)', 'Хороший курс'] : lossPct < 0.035 ? ['rgba(245,194,107,.12)', 'var(--amb)', 'Нормальный курс'] : ['rgba(255,138,101,.12)', '#FFB199', 'Дорогой обмен'];
    html += `<div class="between" style="font-size:13px"><span class="muted">Ваш курс</span><span style="font-weight:700">${fmt(actual, actual < 1 ? 4 : 2)} ${unit}</span></div>
      <div class="verdict" style="background:${v[0]};color:${v[1]}">${v[2]}: ${lossPct >= 0 ? 'потеря' : 'выгода'} ${fmt(Math.abs(lossPct) * 100, 1)}%${lossEur != null ? ' ≈ ' + fmt(Math.abs(lossEur)) + ' €' : ''}</div>`;
  }
  box.innerHTML = html;
}

async function saveAdd() {
  if (S.busy) return;
  const A = S.add, err = $('#a-err');
  err.innerHTML = '';
  const amount = parseNum(A.amount);
  const fail = m => { err.innerHTML = '<div class="err">' + esc(m) + '</div>'; haptic('err'); };
  if (!(amount > 0)) return fail('Введите сумму');
  if (!A.wallet) return fail('Выберите кошелёк');
  if (A.type !== 'Перевод' && !A.cat) return fail('Выберите категорию');
  if (A.type === 'Перевод' && !A.to) return fail('Выберите, куда перевод');
  let comment = A.comment.trim();
  if (A.check && !/чек/i.test(comment)) comment = (comment ? comment + ' ' : '') + '(есть чек)';
  const op = { date: $('#a-date').value || todayISO(), type: A.type, who: A.who, wallet: A.wallet, amount, cur: curOfWallet(A.wallet),
    cat: A.type === 'Перевод' ? '' : A.cat, to: A.type === 'Перевод' ? A.to : '', received: A.type === 'Перевод' ? parseNum(A.received) : '',
    move: A.move, spread: A.type === 'Расход' ? A.spread : 1, comment };
  try { localStorage.setItem('lastWallet', A.wallet); } catch (e) {}
  const btn = $('#a-save');
  S.busy = true; btn.disabled = true; btn.textContent = 'Записываю…';
  try {
    if (DEMO) {
      op.row = Date.now();
      S.data.ops.unshift(op);
      demoApply(op, 1);
      S.lastRow = op.row;
    } else {
      const j = await api('add', { op });
      Object.assign(S.data, j);
      S.lastRow = j.row;
    }
    haptic('ok');
    closeAdd();
    renderAll();
    toast('Записано: ' + (op.type === 'Доход' ? '+' : op.type === 'Расход' ? '−' : '') + money(op.amount, op.cur), 'Отменить', undoLast);
  } catch (e) {
    fail(e.message);
  } finally {
    S.busy = false; btn.disabled = false; btn.textContent = 'Сохранить в таблицу';
  }
}

async function undoLast() {
  if (!S.lastRow) return;
  try {
    if (DEMO) {
      const i = S.data.ops.findIndex(o => o.row === S.lastRow);
      if (i >= 0) { demoApply(S.data.ops[i], -1); S.data.ops.splice(i, 1); }
    } else {
      const j = await api('undo', { row: S.lastRow });
      Object.assign(S.data, j);
    }
    S.lastRow = null;
    renderAll();
    toast('Операция удалена из таблицы');
  } catch (e) { toast('Не получилось отменить: ' + e.message); }
}

/* ================= КОНВЕРТЕР ================= */
function openConv() { renderConv(); $('#sh-conv').classList.add('open'); syncBack(); }
function renderConv() {
  const C = S.conv, r = R();
  const list = ['EUR', 'RSD', 'RUB', 'USD', 'AMD', 'TRY', 'GBP', 'CHF', 'GEL', 'KZT'].filter(c => r[c]);
  $('#conv-body').innerHTML = `
    <div class="chips" role="group" aria-label="Из какой валюты">${list.map(c => `<button class="chip ${C.cur === c ? 'on' : ''}" data-act="convCur" data-v="${c}">${esc(SYM[c] || '')} ${c}</button>`).join('')}</div>
    <label style="display:flex;flex-direction:column;align-items:center;gap:6px"><span class="lbl">Сумма</span>
      <div class="row" style="align-items:baseline;justify-content:center;gap:8px;width:100%"><input id="c-amount" class="amount-in" inputmode="decimal" value="${esc(C.amount)}" style="color:var(--acc);width:${fitW(C.amount)}"><span class="num muted" style="font-size:20px">${esc(SYM[C.cur] || C.cur)}</span></div></label>
    <div class="list" id="c-list"></div>
    <span class="muted" style="font-size:11px">${esc(((S.rates && S.rates.sources) || []).join(' · '))}. Рубль — по официальному курсу ЦБ, остальные — рыночный курс. В обменниках и банках курс хуже на 1–5%.</span>`;
  const draw = () => {
    const a = parseNum(C.amount);
    $('#c-list').innerHTML = list.filter(c => c !== C.cur).map(c => {
      const v = conv(a, C.cur, c), one = conv(1, C.cur, c);
      return `<div class="item"><span class="cb" style="background:${(CUR_COL[c] || '#9AA3AF')}24;color:${CUR_COL[c] || '#C9CFD8'};width:40px;height:40px;border-radius:14px">${esc(SYM[c] || c)}</span>
        <div class="grow"><span class="ttl">${c}</span><span class="meta">1 ${esc(SYM[C.cur] || C.cur)} = ${fmt(one, one < 1 ? 4 : 2)} ${esc(SYM[c] || c)}</span></div>
        <span class="num" style="font-size:15px;font-weight:600">${v == null ? '—' : fmt(v, v >= 1000 ? 0 : 2)}</span></div>`;
    }).join('');
  };
  $('#c-amount').addEventListener('input', e => { C.amount = e.target.value; e.target.style.width = fitW(C.amount); draw(); });
  draw();
}

/* ================= ТОСТ ================= */
let toastT;
function toast(text, btnText, cb) {
  const t = $('#toast'), b = $('#toast-b');
  $('#toast-t').textContent = text;
  if (btnText) { b.textContent = btnText; b.classList.remove('hidden'); b.onclick = () => { t.classList.remove('on'); cb(); }; } else b.classList.add('hidden');
  t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), btnText ? 6000 : 3000);
}

/* ================= СОБЫТИЯ ================= */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { go(g.dataset.go); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const v = b.dataset.v, A = S.add;
  switch (b.dataset.act) {
    case 'homeCur': S.home.cur = v; renderHome(); haptic(); break;
    case 'wcur': S.home.wcur = v; renderHome(); haptic(); break;
    case 'refresh': refresh(); break;
    case 'opsType': S.ops.type = v; S.ops.limit = 60; renderOps(); haptic(); break;
    case 'opsWho': S.ops.who = v; S.ops.limit = 60; renderOps(); haptic(); break;
    case 'more': S.ops.limit += 60; renderOps(); break;
    case 'bPeriod': S.budget.period = v; if (v === 'month' && !S.budget.month) S.budget.month = opMonths()[0]; renderBudget(); haptic(); break;
    case 'bWho': S.budget.who = v; renderBudget(); haptic(); break;
    case 'bWallet': S.budget.wallet = v; renderBudget(); haptic(); break;
    case 'bMove': S.budget.move = !S.budget.move; renderBudget(); haptic(); break;
    case 'bGroup': S.budget.open = S.budget.open === v ? null : v; renderBudget(); haptic(); break;
    case 'openCat': openCat(v); haptic(); break;
    case 'rateRefresh': rateRefresh(); break;
    case 'closeCat': $('#sh-cat').classList.remove('open'); syncBack(); break;
    case 'rfWho': S.rf.who = v; renderRF(); haptic(); break;
    case 'openAdd': openAdd(); haptic(); break;
    case 'closeAdd': closeAdd(); break;
    case 'openConv': openConv(); break;
    case 'closeConv': $('#sh-conv').classList.remove('open'); syncBack(); break;
    case 'convCur': S.conv.cur = v; renderConv(); haptic(); break;
    case 'addType': A.type = v; A.cat = ''; if (v === 'Перевод' && A.to === A.wallet) A.to = ''; renderAdd(); haptic(); break;
    case 'addWho': A.who = v; renderAdd(); haptic(); break;
    case 'addWallet': A.wallet = v; if (A.to === v) A.to = ''; renderAdd(); haptic(); break;
    case 'addTo': A.to = v; renderAdd(); haptic(); break;
    case 'addCat': A.cat = v; renderAdd(); haptic(); break;
    case 'addCheck': A.check = !A.check; renderAdd(); haptic(); break;
    case 'addMove': A.move = !A.move; renderAdd(); haptic(); break;
    case 'spread': A.spread = Math.max(1, Math.min(24, A.spread + (+v))); renderAdd(); haptic(); break;
    case 'save': saveAdd(); break;
  }
});

async function rateRefresh() {
  try {
    if (!DEMO) { const j = await api('rates'); S.rates = j.rates; S.data.artsakh = j.artsakh; }
    renderRF(); toast(S.data.artsakh && S.data.artsakh.ok ? 'Курс обновлён' : 'Курс банка сейчас недоступен'); haptic('ok');
  } catch (e) { toast('Ошибка: ' + e.message); haptic('err'); }
}

async function refresh() {
  const ic = $('#ref-ic'); if (ic) ic.style.animation = 'spin .9s linear infinite';
  try {
    if (DEMO) { S.rates = await ratesDirect(); if (!S.rates.rates.RSD) S.rates = demoRates(); }
    else { const j = await api('all'); Object.assign(S.data, j); S.rates = j.rates; }
    renderAll(); toast('Обновлено'); haptic('ok');
  } catch (e) { toast('Ошибка: ' + e.message); haptic('err'); }
}

/* ================= ДЕМО-ДАННЫЕ (выдуманные цифры) ================= */
function demoRates() {
  return { rates: { EUR: 1, RSD: 117.2, RUB: 92.5, USD: 1.08, AMD: 420, TRY: 37.5, GBP: 0.84, CHF: 0.94 }, chg: { EUR: 0, RUB: 0.004, RSD: 0, USD: -0.002, AMD: 0.001, TRY: 0.003, GBP: 0, CHF: 0 }, sources: ['пример курсов'] };
}
function demoData() {
  const t = todayISO(), d = n => { const x = new Date(Date.now() - n * 864e5); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
  const G = [['Обязательное', [['Жильё', 700], ['Коммуналка', 155], ['Визаран', 85], ['Подписки', 55], ['Связь и интернет', 55], ['Такси', 30], ['Транспорт', 0], ['Кошка', 25], ['Налоги ИП Сербия', 300]]],
    ['Еда', [['Продукты', 335], ['Кафе и рестораны', 200], ['Доставка еды', 50]]],
    ['Личное', [['Курение', 50], ['Бытовое', 40], ['Одежда', 30], ['Здоровье', 30], ['Косметика и уход', 20], ['Обучение', 0], ['Танцы', 50]]],
    ['Радости', [['Развлечения', 40]]],
    ['Запас', [['Прочее', 20], ['Банковские комиссии', 10], ['Работа и техника', 20], ['Сверка', 0]]]];
  const rnd = (p, k) => Math.round(p * k * 100) / 100;
  const groups = G.map((g, gi) => {
    const cats = g[1].map((c, ci) => ({ name: c[0], plan: c[1], fact: [rnd(c[1] || 20, 0.4 + ((ci * 7 + gi) % 5) / 10), rnd(c[1] || 20, 0.6 + ((ci * 3 + gi) % 7) / 10)] }));
    return { name: g[0], plan: g[1].reduce((a, c) => a + c[1], 0), fact: [0, 1].map(i => cats.reduce((a, c) => a + c.fact[i], 0)), cats };
  });
  const tot = [0, 1].map(i => groups.reduce((a, g) => a + g.fact[i], 0));
  const exp = [];
  G.forEach(g => g[1].forEach(c => exp.push({ name: c[0], plan: c[1], group: g[0] })));
  ['Путешествия', 'Подарки', 'Платежи в РФ', 'Налоги РФ', 'Документы и ВНЖ', 'Билеты и дорога'].forEach(n => exp.push({ name: n, plan: null, group: 'Вне бюджета' }));
  return {
    wallets: [
      { name: 'Армянская карта', cur: 'EUR', owner: 'Общее', balance: 5000 },
      { name: 'Наличные EUR', cur: 'EUR', owner: 'Общее', balance: 3000 },
      { name: 'Наличные RSD', cur: 'RSD', owner: 'Общее', balance: 20000 },
      { name: 'Сербский счёт', cur: 'RSD', owner: 'Общее', balance: 0 },
      { name: 'Карты РФ — Егор', cur: 'RUB', owner: 'Егор', balance: 50000 },
      { name: 'Общий счёт РФ', cur: 'RUB', owner: 'Общее', balance: 100000 },
      { name: 'Карты РФ — Лена', cur: 'RUB', owner: 'Лена', balance: 50000 }],
    money: { runway: 4.2, budget: 2300, rfMonthly: 500, trips: 1000 },
    budget: { months: ['Сен 26', 'Окт 26'], groups, total: { plan: 2300, fact: tot },
      outside: { fact: [120, 340], cats: [{ name: 'Подарки', fact: [40, 90] }, { name: 'Платежи в РФ', fact: [80, 250] }] },
      income: { months: ['Сен 26', 'Окт 26'], rows: [{ name: 'Доходы Лены', vals: [1500, 1600] }, { name: 'Доходы Егора', vals: [700, 800] }, { name: 'Всего доходов', vals: [2200, 2400] }, { name: 'Всего трат (с вне бюджета)', vals: [-(tot[0] + 120), -(tot[1] + 340)] }, { name: 'Доходы минус траты', vals: [2200 - tot[0] - 120, 2400 - tot[1] - 340] }] } },
    ops: [
      { row: 1, date: t, type: 'Расход', who: 'Общее', wallet: 'Наличные RSD', amount: 450, cur: 'RSD', cat: 'Кафе и рестораны', comment: 'Пекарня (есть чек)' },
      { row: 2, date: t, type: 'Расход', who: 'Общее', wallet: 'Армянская карта', amount: 18.4, cur: 'EUR', cat: 'Продукты', comment: 'Доставка продуктов' },
      { row: 3, date: d(1), type: 'Доход', who: 'Егор', wallet: 'Карты РФ — Егор', amount: 15000, cur: 'RUB', cat: 'Работа / ИП', comment: 'Монтаж ролика' },
      { row: 4, date: d(1), type: 'Расход', who: 'Лена', wallet: 'Наличные RSD', amount: 2500, cur: 'RSD', cat: 'Танцы', comment: 'Аренда зала' },
      { row: 5, date: d(2), type: 'Перевод', who: 'Общее', wallet: 'Наличные EUR', amount: 100, cur: 'EUR', to: 'Наличные RSD', received: 11650, comment: 'Обмен' },
      { row: 6, date: d(3), type: 'Расход', who: 'Общее', wallet: 'Карты РФ — Лена', amount: 1200, cur: 'RUB', cat: 'Такси', comment: '' }],
    rf: { rows: [
      { date: d(40), who: 'Общее', from: 'Общий счёт РФ', sent: 100000, to: 'Армянская карта', got: 960, cur: 'EUR', rate: 104.17, cb: 100.1, lossPct: 0.039, lossEur: 39, gotEur: 960 },
      { date: d(25), who: 'Егор', from: 'Карты РФ — Егор', sent: 50000, to: 'Армянская карта', got: 490, cur: 'EUR', rate: 102.04, cb: 98.2, lossPct: 0.038, lossEur: 19, gotEur: 490 },
      { date: d(10), who: 'Лена', from: 'Карты РФ — Лена', sent: 50000, to: 'Армянская карта', got: 505, cur: 'EUR', rate: 99.0, cb: 95.0, lossPct: 0.04, lossEur: 21, gotEur: 505 }] },
    dict: { expense: exp, income: ['Работа / ИП', 'Преподавание танцев', 'Прочий доход'] },
    artsakh: { ok: true, rate: 95.37, withFee: 95.85, eurSell: 412, rubBuy: 4.32, fee: 0.005, good: 98, bad: 102, zone: 'green', updated: '23 окт., 18:00' }
  };
}
function demoApply(op, sign) {
  const ws = S.data.wallets, w = ws.find(x => x.name === op.wallet);
  if (!w) return;
  if (op.type === 'Расход') w.balance -= sign * op.amount;
  else if (op.type === 'Доход') w.balance += sign * op.amount;
  else { w.balance -= sign * op.amount; const t = ws.find(x => x.name === op.to); if (t) t.balance += sign * (op.received || conv(op.amount, op.cur, t.cur) || 0); }
}

boot();
